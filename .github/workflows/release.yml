name: Release
on:
  push:
    branches:
      - master
      - next
      - beta
jobs:
  release:
    name: Release
    # Change: Update to ubuntu-latest or ubuntu-22.04
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Change: Update to v4 for better security and Node support
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        # Change: Update to v4 and use a modern Node version (20 or 22)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          yarn install
          yarn build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
        
